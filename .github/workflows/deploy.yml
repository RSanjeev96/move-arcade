name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build preview with every game, including ones still in progress (/preview/)
        continue-on-error: true
        run: |
          git fetch --depth=1 origin wip/game-builds
          git worktree add /tmp/wip FETCH_HEAD
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/wip/node_modules
          cd /tmp/wip
          BASE_PATH=/${{ github.event.repository.name }}/preview/ VITE_ALL_GAMES=1 npx vite build --outDir "$GITHUB_WORKSPACE/dist/preview"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
